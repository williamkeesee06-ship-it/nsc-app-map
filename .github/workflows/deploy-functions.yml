name: Deploy Firebase Functions

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firebase.json'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install functions deps
        working-directory: functions
        run: npm ci

      - name: Build functions
        working-directory: functions
        run: npm run build

      - name: Auth to Firebase
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Register ITIC_USERNAME secret with Firebase
        run: echo -n "${{ secrets.ITIC_USERNAME_VALUE }}" | npx firebase-tools functions:secrets:set ITIC_USERNAME --project "${{ secrets.FIREBASE_PROJECT_ID }}" --data-file=- --force
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}

      - name: Register ITIC_PASSWORD secret with Firebase
        run: echo -n "${{ secrets.ITIC_PASSWORD_VALUE }}" | npx firebase-tools functions:secrets:set ITIC_PASSWORD --project "${{ secrets.FIREBASE_PROJECT_ID }}" --data-file=- --force
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}

      - name: Register SMARTSHEET_ACCESS_TOKEN secret with Firebase
        run: echo -n "${{ secrets.SMARTSHEET_ACCESS_TOKEN }}" | npx firebase-tools functions:secrets:set SMARTSHEET_ACCESS_TOKEN --project "${{ secrets.FIREBASE_PROJECT_ID }}" --data-file=- --force
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}

      - name: Deploy Functions
        run: npx firebase-tools deploy --only functions --project "$FIREBASE_PROJECT_ID" --non-interactive
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || 'nsc-app-map' }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
